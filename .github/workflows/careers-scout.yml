name: Careers Scout tests
on:
  pull_request:
    paths:
      - 'careers-scout/**'
      - '.github/workflows/careers-scout.yml'
  push:
    branches: [main]
    paths:
      - 'careers-scout/**'
      - '.github/workflows/careers-scout.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        working-directory: careers-scout
      - run: python -m py_compile scripts/careers.py
        working-directory: careers-scout
